<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login successful</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
    }

    /* Navbar: 65px height, absolute overlay, glass-style bar */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      width: 100%;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 2.75rem;
      padding-right: 3rem;
      border-bottom: 1px solid rgba(142, 137, 136, 0.5);
      background: rgba(40, 40, 48, 0.85);
      backdrop-filter: blur(64px);
      -webkit-backdrop-filter: blur(64px);
    }

    .navbar-logo {
      height: 1.5rem;
      width: auto;
      display: block;
      position: relative;
      top: -5px;
    }

    /* Main: full viewport (navbar overlays), login-style background */
    .main {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      background: #090a0f;
    }

    .main-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .main-bg img {
      position: absolute;
      width: auto;
      height: 61vh;
      max-width: none;
      object-fit: contain;
      /* transform: scale(0.5); */
    }

    .bg-square-top-right {
      top: -6vh;
      right: -46vw;
    }

    .bg-square-bottom-left {
      bottom: -6vh;
      left: -46vw;
    }

    /* Cut-corner glass card: outer clip (border) + inner (fill + blur) */
    .card-wrap {
      position: relative;
      z-index: 10;
      width: min(38.375rem, 92vw);
      padding: 2.8125rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .card-outer {
      position: absolute;
      inset: 0;
      z-index: -1;
      clip-path: polygon(0 0,
          calc(100% - 24px) 0,
          100% 24px,
          100% 100%,
          24px 100%,
          0 calc(100% - 24px));
      background-color: rgba(40, 40, 48, 0.6);
      border: 1px solid rgba(142, 137, 136, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card-inner {
      position: absolute;
      inset: 1px;
      z-index: -1;
      clip-path: polygon(0 0,
          calc(100% - 23px) 0,
          100% 23px,
          100% 100%,
          23px 100%,
          0 calc(100% - 23px));
      /* background-color: rgba(40, 40, 48, 0.75); */
    }

    .card-text {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.5;
      color: #fff;
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="navbar" role="banner">
    <nav aria-label="Main">
      <img src="ha30-logo2.svg" alt="HA30 Logo" class="navbar-logo" />
    </nav>
  </header>
  <main class="main" role="main">
    <div class="main-bg" aria-hidden="true">
      <img src="squares-blurred-1.webp" alt="" class="bg-square-top-right" />
      <img src="squares-blurred-2.webp" alt="" class="bg-square-bottom-left" />
    </div>
    <section class="card-wrap">
      <div class="card-outer">
        <div class="card-inner"></div>
      </div>
      <p class="card-text">Login successful! You can close this page.</p>
    </section>
  </main>
</body>

</html>
