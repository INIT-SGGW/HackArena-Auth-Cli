<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login successful</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000314'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-size='28' font-family='Arial,sans-serif' fill='%23ffd200'%3EHA%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          "JetBrains Mono",
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* Navbar: 65px height, absolute overlay, glass-style bar */
      .navbar {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
        width: 100%;
        display: flex;
        align-items: center;
        padding-top: 1.5rem;
        padding-bottom: 1.5rem;
        padding-left: 2.75rem;
        padding-right: 3rem;
        border-bottom: 1px solid #22263c;
        background: #000314;
        backdrop-filter: blur(64px);
        -webkit-backdrop-filter: blur(64px);
      }

      .navbar-logo {
        height: 2rem;
        width: auto;
        display: block;
      }

      /* Main: full viewport (navbar overlays), login-style background */
      .main {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        background: #000314;
      }

      .main-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .main-bg img {
        position: absolute;
        width: auto;
        height: 61vh;
        max-width: none;
        object-fit: contain;
        /* transform: scale(0.5); */
      }

      .bg-square-top-right {
        top: -6vh;
        right: -46vw;
      }

      .bg-square-bottom-left {
        bottom: -6vh;
        left: -46vw;
      }

      /* Cut-corner glass card: outer clip (border) + inner (fill + blur) */
      .card-wrap {
        position: relative;
        z-index: 10;
        width: min(38.375rem, 92vw);
        padding: 2.8125rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        isolation: isolate;
      }

      .card-outer {
        position: absolute;
        inset: 0;
        z-index: -1;
        clip-path: polygon(
          0 0,
          calc(100% - 24px) 0,
          100% 24px,
          100% 100%,
          24px 100%,
          0 calc(100% - 24px)
        );
        background-color: #22263c;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }

      .card-inner {
        position: absolute;
        inset: 1px;
        z-index: -1;
        clip-path: polygon(
          0 0,
          calc(100% - 23px) 0,
          100% 23px,
          100% 100%,
          23px 100%,
          0 calc(100% - 23px)
        );
        /* background-color: rgba(40, 40, 48, 0.75); */
      }

      .card-text {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.5;
        color: #fff;
        text-align: center;
      }

      .card-title {
        margin: 0 0 1rem;
        font-size: 1.875rem;
        line-height: 1.25;
        color: #ffd200;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header class="navbar" role="banner">
      <nav aria-label="Main">
        <img src="hackarena-logo.svg" alt="HA Logo" class="navbar-logo" />
      </nav>
    </header>
    <main class="main" role="main">
      <section class="card-wrap">
        <div class="card-outer">
          <div class="card-inner"></div>
        </div>
        <h1 class="card-title">Login successful!</h1>
        <p class="card-text">
          You have been logged in successfully. You can close this page.
        </p>
      </section>
    </main>
  </body>
</html>
